<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>NEON RAIDERS '86</title>
  <style>
    :root {
      --bg: #070015;
      --panel: #171033;
      --neon: #7af0ff;
      --pink: #ff4fd2;
      --orange: #ff7a59;
      --gold: #ffe666;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: #fff;
      font-family: "Courier New", monospace;
      background: radial-gradient(circle at 50% 8%, #25115a 0%, #090018 45%, #020009 100%);
    }
    .cabinet {
      width: min(95vw, 520px);
      background: linear-gradient(180deg, #1a1336 0%, #0e0a24 100%);
      border: 4px solid #6556b2;
      border-radius: 12px;
      padding: 10px;
      box-shadow: 0 0 20px #3f3f9a, 0 0 50px rgba(41, 33, 117, 0.7) inset;
    }
    .title {
      margin: 0 0 8px;
      text-align: center;
      letter-spacing: 2px;
      color: #ffe8ff;
      text-shadow: 0 0 8px var(--pink);
      font-size: clamp(18px, 4vw, 26px);
    }
    #game {
      width: 100%;
      aspect-ratio: 3/4;
      border: 2px solid #8f7ada;
      background: #04000d;
      display: block;
      image-rendering: pixelated;
    }
    .info {
      margin-top: 8px;
      text-align: center;
      color: var(--neon);
      text-shadow: 0 0 5px rgba(122, 240, 255, 0.65);
      font-size: 12px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <main class="cabinet">
    <h1 class="title">NEON RAIDERS '86</h1>
    <canvas id="game" width="360" height="480" aria-label="80年代風縦スクロールシューティング"></canvas>
    <div class="info">移動: ←→↑↓ / WASD ・ ショット: SPACE ・ ポーズ: P ・ 再開: ENTER</div>
  </main>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const W = canvas.width;
    const H = canvas.height;

    const state = {
      keys: new Set(),
      stars: [],
      particles: [],
      bullets: [],
      enemyBullets: [],
      enemies: [],
      drops: [],
      score: 0,
      hi: Number(localStorage.getItem('neon_raiders_hi') || 0),
      lives: 3,
      level: 1,
      time: 0,
      spawnCd: 0,
      fireCd: 0,
      paused: false,
      gameOver: false,
      invuln: 0,
      waveTimer: 0,
      player: {
        x: W / 2,
        y: H - 60,
        w: 16,
        h: 22,
        speed: 230,
        power: 1,
      },
    };

    for (let i = 0; i < 100; i++) {
      state.stars.push({ x: Math.random() * W, y: Math.random() * H, z: 1 + Math.random() * 2.4 });
    }

    const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
    const rand = (a, b) => a + Math.random() * (b - a);
    const collides = (a, b) => (
      Math.abs(a.x - b.x) * 2 < (a.w + b.w) &&
      Math.abs(a.y - b.y) * 2 < (a.h + b.h)
    );

    const explode = (x, y, color, n = 12, speed = 120) => {
      for (let i = 0; i < n; i++) {
        const ang = (Math.PI * 2 * i) / n + Math.random() * 0.35;
        const vel = speed * rand(0.5, 1.2);
        state.particles.push({
          x, y,
          vx: Math.cos(ang) * vel,
          vy: Math.sin(ang) * vel,
          life: rand(0.3, 0.95),
          color,
        });
      }
    };

    const reset = () => {
      state.score = 0;
      state.lives = 3;
      state.level = 1;
      state.time = 0;
      state.spawnCd = 0.4;
      state.fireCd = 0;
      state.paused = false;
      state.gameOver = false;
      state.invuln = 1.8;
      state.waveTimer = 0;
      state.bullets.length = 0;
      state.enemyBullets.length = 0;
      state.enemies.length = 0;
      state.particles.length = 0;
      state.drops.length = 0;
      state.player.x = W / 2;
      state.player.y = H - 60;
      state.player.power = 1;
    };

    const spawnEnemy = () => {
      const lv = 1 + Math.floor(state.time / 18);
      state.level = lv;

      const bossWave = state.waveTimer > 18;
      if (bossWave) {
        state.waveTimer = 0;
        state.enemies.push({
          type: 'ace',
          x: rand(50, W - 50), y: -24,
          w: 28, h: 28,
          hp: 9 + lv * 2,
          vx: rand(-35, 35),
          vy: 40 + lv * 3,
          shotCd: 1.3,
          score: 600,
        });
        return;
      }

      const type = Math.random() < 0.25 ? 'zig' : 'grunt';
      if (type === 'grunt') {
        state.enemies.push({
          type,
          x: rand(16, W - 16), y: -16,
          w: 18, h: 18,
          hp: 1 + Math.floor(lv / 4),
          vx: rand(-20, 20),
          vy: rand(70, 120) + lv * 4,
          shotCd: rand(1.1, 2.2),
          score: 120,
        });
      } else {
        const left = Math.random() < 0.5;
        state.enemies.push({
          type,
          x: left ? 18 : W - 18, y: -16,
          w: 20, h: 20,
          hp: 2 + Math.floor(lv / 3),
          vx: left ? rand(45, 72) : rand(-72, -45),
          vy: rand(65, 95) + lv * 3,
          shotCd: rand(0.9, 1.8),
          score: 180,
        });
      }
    };

    const shootPlayer = () => {
      const p = state.player;
      const power = p.power;
      const shots = [0];
      if (power >= 2) shots.push(-10, 10);
      if (power >= 3) shots.push(-18, 18);
      for (const ox of shots) {
        state.bullets.push({ x: p.x + ox, y: p.y - 12, w: 4, h: 10, vx: ox * 0.22, vy: -330 });
      }
      if (power >= 4) {
        state.bullets.push({ x: p.x - 6, y: p.y - 8, w: 4, h: 10, vx: -90, vy: -270 });
        state.bullets.push({ x: p.x + 6, y: p.y - 8, w: 4, h: 10, vx: 90, vy: -270 });
      }
    };

    const shootEnemy = (e) => {
      const dx = state.player.x - e.x;
      const dy = Math.max(30, state.player.y - e.y);
      const len = Math.hypot(dx, dy);
      const sp = e.type === 'ace' ? 170 : 130;
      state.enemyBullets.push({
        x: e.x, y: e.y + 6, w: 5, h: 9,
        vx: (dx / len) * sp,
        vy: (dy / len) * sp,
      });
      if (e.type === 'ace') {
        state.enemyBullets.push({ x: e.x - 8, y: e.y, w: 4, h: 8, vx: -70, vy: 160 });
        state.enemyBullets.push({ x: e.x + 8, y: e.y, w: 4, h: 8, vx: 70, vy: 160 });
      }
    };

    const loseLife = () => {
      state.lives -= 1;
      state.invuln = 2.2;
      explode(state.player.x, state.player.y, '#ff4fd2', 24, 150);
      if (state.lives <= 0) {
        state.gameOver = true;
        state.hi = Math.max(state.hi, state.score);
        localStorage.setItem('neon_raiders_hi', String(state.hi));
      }
    };

    const update = (dt) => {
      if (state.paused || state.gameOver) return;
      state.time += dt;
      state.waveTimer += dt;

      for (const s of state.stars) {
        s.y += dt * (26 + s.z * 30);
        if (s.y > H) { s.y = -2; s.x = Math.random() * W; }
      }

      const p = state.player;
      const left = state.keys.has('ArrowLeft') || state.keys.has('KeyA');
      const right = state.keys.has('ArrowRight') || state.keys.has('KeyD');
      const up = state.keys.has('ArrowUp') || state.keys.has('KeyW');
      const down = state.keys.has('ArrowDown') || state.keys.has('KeyS');
      if (left) p.x -= p.speed * dt;
      if (right) p.x += p.speed * dt;
      if (up) p.y -= p.speed * dt;
      if (down) p.y += p.speed * dt;
      p.x = clamp(p.x, 12, W - 12);
      p.y = clamp(p.y, H * 0.45, H - 14);

      state.fireCd -= dt;
      const firing = state.keys.has('Space');
      if (firing && state.fireCd <= 0) {
        shootPlayer();
        state.fireCd = Math.max(0.07, 0.18 - state.player.power * 0.02);
      }

      state.spawnCd -= dt;
      if (state.spawnCd <= 0) {
        spawnEnemy();
        state.spawnCd = Math.max(0.22, 0.7 - state.level * 0.03);
      }

      for (const b of state.bullets) {
        b.x += b.vx * dt;
        b.y += b.vy * dt;
      }
      state.bullets = state.bullets.filter(b => b.y > -20 && b.x > -30 && b.x < W + 30);

      for (const b of state.enemyBullets) {
        b.x += b.vx * dt;
        b.y += b.vy * dt;
      }
      state.enemyBullets = state.enemyBullets.filter(b => b.y < H + 20 && b.x > -20 && b.x < W + 20);

      for (const e of state.enemies) {
        if (e.type === 'zig') e.vx += Math.sin(state.time * 6 + e.y * 0.03) * 2;
        e.x += e.vx * dt;
        e.y += e.vy * dt;
        if (e.x < 14 || e.x > W - 14) e.vx *= -1;
        e.shotCd -= dt;
        if (e.shotCd <= 0 && e.y > 0 && e.y < H * 0.8) {
          shootEnemy(e);
          e.shotCd = e.type === 'ace' ? rand(0.55, 1.1) : rand(1.0, 2.0);
        }
      }

      for (const b of state.bullets) {
        for (const e of state.enemies) {
          if (e.hp > 0 && collides(b, e)) {
            b.y = -999;
            e.hp -= 1;
            explode(b.x, b.y + 8, '#ffe666', 4, 60);
            if (e.hp <= 0) {
              state.score += e.score;
              explode(e.x, e.y, '#ff7a59', e.type === 'ace' ? 28 : 14, e.type === 'ace' ? 170 : 120);
              if (Math.random() < 0.12 || e.type === 'ace') {
                state.drops.push({ x: e.x, y: e.y, w: 12, h: 12, vy: 80, type: 'power' });
              }
            }
            break;
          }
        }
      }
      state.bullets = state.bullets.filter(b => b.y > -100);

      for (const d of state.drops) d.y += d.vy * dt;
      state.drops = state.drops.filter(d => d.y < H + 20);

      state.invuln -= dt;
      if (state.invuln <= 0) {
        for (const e of state.enemies) {
          if (e.hp > 0 && collides(p, e)) {
            e.hp = 0;
            loseLife();
            break;
          }
        }
        for (const b of state.enemyBullets) {
          if (collides(p, b)) {
            b.y = 999;
            loseLife();
            break;
          }
        }
      }

      for (const d of state.drops) {
        if (collides(p, d)) {
          d.y = 999;
          state.score += 50;
          state.player.power = Math.min(4, state.player.power + 1);
          explode(d.x, d.y, '#7af0ff', 14, 110);
        }
      }

      state.enemies = state.enemies.filter(e => e.hp > 0 && e.y < H + 36);
      state.enemyBullets = state.enemyBullets.filter(b => b.y < H + 50);
      state.drops = state.drops.filter(d => d.y < H + 50);

      for (const p of state.particles) {
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vx *= 0.985;
        p.vy *= 0.985;
        p.life -= dt;
      }
      state.particles = state.particles.filter(p => p.life > 0);

      state.hi = Math.max(state.hi, state.score);
    };

    const drawPlayer = (p, alpha = 1) => {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.globalAlpha = alpha;
      ctx.fillStyle = '#7af0ff';
      ctx.beginPath();
      ctx.moveTo(0, -12);
      ctx.lineTo(9, 10);
      ctx.lineTo(0, 6);
      ctx.lineTo(-9, 10);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#ff4fd2';
      ctx.fillRect(-2, 2, 4, 8);
      ctx.restore();
    };

    const drawEnemy = (e) => {
      ctx.save();
      ctx.translate(e.x, e.y);
      if (e.type === 'ace') {
        ctx.fillStyle = '#ff9d4a';
        ctx.fillRect(-12, -12, 24, 24);
        ctx.fillStyle = '#3b1400';
        ctx.fillRect(-8, -3, 16, 6);
      } else {
        ctx.fillStyle = e.type === 'zig' ? '#ff8d78' : '#ff735a';
        ctx.fillRect(-9, -9, 18, 18);
        ctx.fillStyle = '#2a0011';
        ctx.fillRect(-6, -2, 12, 4);
      }
      if (e.hp > 1) {
        ctx.strokeStyle = '#fff';
        ctx.strokeRect(-10, -10, 20, 20);
      }
      ctx.restore();
    };

    const render = () => {
      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = '#04000a';
      ctx.fillRect(0, 0, W, H);

      for (const s of state.stars) {
        ctx.fillStyle = `rgba(152,168,255,${0.18 + s.z / 2.8})`;
        ctx.fillRect(s.x, s.y, s.z, s.z * 2.2);
      }

      ctx.fillStyle = 'rgba(255,255,255,0.045)';
      for (let y = 0; y < H; y += 4) ctx.fillRect(0, y, W, 1);

      for (const b of state.bullets) {
        ctx.fillStyle = '#ffe666';
        ctx.fillRect(b.x - 1, b.y - 8, 3, 10);
      }

      for (const b of state.enemyBullets) {
        ctx.fillStyle = '#ff4fd2';
        ctx.fillRect(b.x - 2, b.y - 5, 4, 8);
      }

      for (const d of state.drops) {
        ctx.fillStyle = '#7af0ff';
        ctx.fillRect(d.x - 6, d.y - 6, 12, 12);
        ctx.fillStyle = '#001525';
        ctx.fillRect(d.x - 2, d.y - 4, 4, 8);
      }

      for (const e of state.enemies) drawEnemy(e);

      const flicker = state.invuln > 0 ? (Math.floor(performance.now() / 70) % 2 ? 0.2 : 1) : 1;
      if (!state.gameOver || flicker > 0.4) drawPlayer(state.player, flicker);

      for (const p of state.particles) {
        ctx.globalAlpha = clamp(p.life * 1.25, 0, 1);
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, 2, 2);
      }
      ctx.globalAlpha = 1;

      ctx.fillStyle = '#7af0ff';
      ctx.font = '14px "Courier New"';
      ctx.fillText(`SCORE ${state.score.toString().padStart(7, '0')}`, 10, 20);
      ctx.fillText(`HI ${state.hi.toString().padStart(7, '0')}`, 210, 20);
      ctx.fillStyle = '#ffd0f4';
      ctx.fillText(`LIFE ${'◆'.repeat(Math.max(0, state.lives))}`, 10, 40);
      ctx.fillText(`LV ${String(state.level).padStart(2, '0')}`, 300, 40);
      ctx.fillStyle = '#7af0ff';
      ctx.fillText(`PWR ${'■'.repeat(state.player.power)}`, 10, 60);

      if (state.paused && !state.gameOver) {
        ctx.fillStyle = 'rgba(0,0,0,0.45)';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#ffe666';
        ctx.textAlign = 'center';
        ctx.font = '24px "Courier New"';
        ctx.fillText('PAUSE', W / 2, H / 2);
        ctx.textAlign = 'left';
      }

      if (state.gameOver) {
        ctx.fillStyle = 'rgba(0,0,0,0.58)';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#ff4fd2';
        ctx.textAlign = 'center';
        ctx.font = '26px "Courier New"';
        ctx.fillText('GAME OVER', W / 2, H / 2 - 12);
        ctx.fillStyle = '#fff';
        ctx.font = '14px "Courier New"';
        ctx.fillText('PRESS ENTER TO RESTART', W / 2, H / 2 + 22);
        ctx.textAlign = 'left';
      }
    };

    let prev = performance.now();
    const loop = (now) => {
      const dt = Math.min(0.033, (now - prev) / 1000);
      prev = now;
      update(dt);
      render();
      requestAnimationFrame(loop);
    };

    addEventListener('keydown', (e) => {
      if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space', 'KeyW', 'KeyA', 'KeyS', 'KeyD', 'Enter', 'KeyP'].includes(e.code)) {
        e.preventDefault();
      }
      if (e.code === 'KeyP' && !state.gameOver) state.paused = !state.paused;
      if (e.code === 'Enter' && state.gameOver) reset();
      state.keys.add(e.code);
    });

    addEventListener('keyup', (e) => state.keys.delete(e.code));

    reset();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
